aid: betternight
name: BetterNight
description: 'BetterNight is a San Diego, California virtual-care sleep health company
  that diagnoses and treats obstructive sleep apnea end to end: telemedicine consults
  with sleep physicians, home sleep testing devices shipped to the patient, board-certified
  interpretation and therapy recommendation, home delivery of PAP and oral appliance
  therapy, and ongoing coaching by sleep specialists and respiratory therapists. It
  also offers a cognitive behavioral therapy program for insomnia and remote patient
  monitoring of PAP adherence. The company sells to individuals as well as to physicians,
  cardiologists, ENT practices, clinics, health plans and ACOs, employers, and DOT/commercial
  transportation programs. It reports roughly 300 sleep health professionals, Joint
  Commission accreditation held for over 15 years, and SOC 2 Type II compliance, and
  in 2026 acquired Coastal Sleep Diagnostics and Epoch Sleep Centers. BetterNight is
  a healthcare services operator, not an API platform: it publishes no developer program,
  API documentation, or machine-readable specification.'
